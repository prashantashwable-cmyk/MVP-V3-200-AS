<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AIEC Work Manager</title>
  <link rel="icon" href="/icon.png" />
  <style>
    :root {
      --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f0f2f5; --text: #15181d; --muted: #5b6472; --border: #dde1e7;
      --brand: #0b5cad; --brand-ink: #ffffff; --ok: #177245; --ok-bg: #e3f4ea; --warn: #9a5b00; --warn-bg: #fff2d9;
      --bad: #b42318; --bad-bg: #fde8e6; --info-bg: #e6f0fb; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --text: #e8eaed; --muted: #9aa3af; --border: #2b313b;
        --brand: #4c9aff; --brand-ink: #06121f; --ok: #5fd08f; --ok-bg: #11301f; --warn: #f3b44c; --warn-bg: #33260d;
        --bad: #ff7b6e; --bad-bg: #3a1512; --info-bg: #13253b; --shadow: none; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
        --bg: #0f1216; --surface: #171b21; --surface-2: #1e232b; --text: #e8eaed; --muted: #9aa3af; --border: #2b313b;
        --brand: #4c9aff; --brand-ink: #06121f; --ok: #5fd08f; --ok-bg: #11301f; --warn: #f3b44c; --warn-bg: #33260d;
        --bad: #ff7b6e; --bad-bg: #3a1512; --info-bg: #13253b; --shadow: none; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--brand); }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
    .narrow { max-width: 640px; }
    header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
    header.top .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
    .brand { font-weight: 700; letter-spacing: .2px; }
    .brand small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
    .spacer { flex: 1; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
    .card + .card { margin-top: 12px; }
    .grid > .card + .card { margin-top: 0; }
    .grid { display: grid; gap: 12px; }
    .kpis { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .kpi .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    h1, h2, h3 { margin: 0 0 8px; line-height: 1.25; }
    h1 { font-size: 22px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
    .btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; min-height: 38px; }
    .btn:hover { background: var(--surface-2); }
    .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
    .btn.big { padding: 14px 18px; font-size: 17px; width: 100%; min-height: 52px; }
    .btn.danger { color: var(--bad); border-color: var(--bad); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--border); margin: 12px 0; }
    .tabs button { border: 0; background: none; padding: 10px 12px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); white-space: nowrap; }
    .tabs button.on { color: var(--text); border-bottom-color: var(--brand); font-weight: 600; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
    .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
    .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.info { background: var(--info-bg); color: var(--brand); }
    .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--brand); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
    tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
    .scroll-x { overflow-x: auto; }
    .exc { border-left: 4px solid var(--warn); }
    .exc.critical { border-left-color: var(--bad); }
    dl.why { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 8px 0 0; }
    dl.why dt { color: var(--muted); font-size: 13px; } dl.why dd { margin: 0; }
    input[type=text], input[type=number], input[type=password], select, textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    label.chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--border); }
    label.chk input { width: 20px; height: 20px; margin-top: 1px; }
    .req { display: flex; gap: 8px; align-items: center; padding: 6px 0; }
    .tick { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 13px; border: 1.5px solid var(--border); flex: none; }
    .tick.on { background: var(--ok); border-color: var(--ok); color: #fff; }
    .thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
    .thumbs img { width: 96px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; justify-content: flex-end; }
    .modal > .sheet { background: var(--bg); width: min(760px, 100%); height: 100%; overflow-y: auto; padding: 16px; }
    .modal.center { justify-content: center; align-items: center; padding: 16px; }
    .dialog { width: min(420px, 100%); }
    .timeline { list-style: none; margin: 0; padding: 0; }
    .timeline li { display: grid; grid-template-columns: 110px 90px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .timeline li.admin { background: var(--warn-bg); }
    .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: calc(100% - 32px); }
    .hero { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
    .hero .muted { color: inherit; opacity: .8; }
    .sig { width: 100%; height: 140px; background: #fff; border: 1px dashed var(--border); border-radius: 8px; touch-action: none; }
    .log { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 320px; overflow-y: auto; background: var(--surface-2); padding: 8px; border-radius: 8px; }
    .mock { font-size: 11px; font-weight: 700; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; }
    @media (max-width: 640px) {
      .timeline li { grid-template-columns: 1fr; gap: 0; }
      .hide-sm { display: none; }
      dl.why { grid-template-columns: 1fr; } dl.why dt { margin-top: 6px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
